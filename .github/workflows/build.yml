# Gera o app Android (APK) e a versão de computador a cada envio para a branch main,
# e publica os arquivos na página "Releases" do repositório, na versão "ultima-versao".
name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-app
  cancel-in-progress: true

jobs:
  android-e-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Chave de assinatura fixa (secrets do repositório). Sem ela o APK é assinado com uma chave
      # temporária e o Android não deixa instalar uma versão nova por cima da anterior.
      - name: Preparar chave de assinatura
        env:
          ASSINATURA_BASE64: ${{ secrets.ASSINATURA_BASE64 }}
        run: |
          if [ -n "$ASSINATURA_BASE64" ]; then
            echo "$ASSINATURA_BASE64" | base64 -d > app/assinatura.jks
            echo "Chave de assinatura configurada."
          else
            echo "::warning::Secret ASSINATURA_BASE64 não configurado: o APK sai com chave temporária."
          fi

      - name: Compilar Android e computador
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :desktop:jarCompleto

      - name: Montar arquivos
        run: |
          mkdir -p dist/computador
          cp app/build/outputs/apk/release/app-release.apk dist/GestaoConfeitaria.apk
          cp desktop/build/libs/GestaoConfeitaria.jar dist/computador/
          cp "desktop/extras/Abrir no Windows.bat" desktop/extras/abrir.sh dist/computador/
          (cd dist && zip -r GestaoConfeitaria-Computador-Java.zip computador)

      - uses: actions/upload-artifact@v4
        with:
          name: android-e-jar
          path: |
            dist/GestaoConfeitaria.apk
            dist/GestaoConfeitaria-Computador-Java.zip

  # Versão para Windows que já traz o Java dentro: é só descompactar e abrir GestaoConfeitaria.exe
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: .\gradlew.bat --no-daemon :desktop:jarCompleto
      - name: Empacotar com Java embutido
        shell: pwsh
        run: |
          $versao = "2.0.$env:GITHUB_RUN_NUMBER"
          jpackage --type app-image --input desktop/build/libs --main-jar GestaoConfeitaria.jar `
            --main-class com.gestaoconfeitaria.desktop.MainKt --name GestaoConfeitaria `
            --app-version $versao --vendor "Gestao Confeitaria" --dest dist `
            --add-modules java.base,java.desktop,java.net.http,java.xml,jdk.httpserver,jdk.crypto.ec,java.naming,jdk.charsets,jdk.localedata,jdk.zipfs `
            --java-options "-Dfile.encoding=UTF-8"
          Compress-Archive -Path dist/GestaoConfeitaria -DestinationPath dist/GestaoConfeitaria-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/GestaoConfeitaria-Windows.zip

  publicar:
    needs: [android-e-jar, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao dist/GestaoConfeitaria.apk dist/GestaoConfeitaria-Windows.zip dist/GestaoConfeitaria-Computador-Java.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Última versão (build ${GITHUB_RUN_NUMBER})" \
            --notes "Celular Android: baixe GestaoConfeitaria.apk e instale. Windows: baixe GestaoConfeitaria-Windows.zip, descompacte e abra GestaoConfeitaria.exe (não precisa instalar Java). Mac/Linux ou quem já tem Java: GestaoConfeitaria-Computador-Java.zip."
