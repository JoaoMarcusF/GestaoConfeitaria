# Gera o app Android (APK) e a versão de computador a cada envio para a branch main,
# e publica os arquivos na página "Releases" do repositório, na versão "ultima-versao".
name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Chave de assinatura fixa (secrets do repositório). Sem ela o APK é assinado com uma chave
      # temporária e o Android não deixa instalar uma versão nova por cima da anterior.
      - name: Preparar chave de assinatura
        env:
          ASSINATURA_BASE64: ${{ secrets.ASSINATURA_BASE64 }}
        run: |
          if [ -n "$ASSINATURA_BASE64" ]; then
            echo "$ASSINATURA_BASE64" | base64 -d > app/assinatura.jks
            echo "Chave de assinatura configurada."
          else
            echo "::warning::Secret ASSINATURA_BASE64 não configurado: o APK sai com chave temporária."
          fi

      - name: Compilar Android e computador
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :desktop:jarCompleto

      - name: Montar arquivos para download
        run: |
          mkdir -p dist/computador
          cp app/build/outputs/apk/release/app-release.apk dist/GestaoConfeitaria.apk
          cp desktop/build/libs/GestaoConfeitaria.jar dist/computador/
          cp "desktop/extras/Abrir no Windows.bat" desktop/extras/abrir.sh dist/computador/
          (cd dist && zip -r GestaoConfeitaria-Computador.zip computador)

      - uses: actions/upload-artifact@v4
        with:
          name: gestao-confeitaria
          path: |
            dist/GestaoConfeitaria.apk
            dist/GestaoConfeitaria-Computador.zip

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao dist/GestaoConfeitaria.apk dist/GestaoConfeitaria-Computador.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Última versão (build ${GITHUB_RUN_NUMBER})" \
            --notes "Celular: baixe GestaoConfeitaria.apk no Android e instale. Computador: baixe GestaoConfeitaria-Computador.zip, descompacte e abra 'Abrir no Windows.bat' (precisa do Java 17+, adoptium.net)."
